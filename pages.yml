name: Deploy My Browser Arcade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html games.js .nojekyll dist/
          while IFS= read -r -d '' file; do
            output="${file%.gz.b64}"
            mkdir -p "dist/$(dirname "$output")"
            base64 --decode "$file" | gzip --decompress --stdout > "dist/$output"
            echo "Prepared $output"
          done < <(find games -type f -name 'index.html.gz.b64' -print0)

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
