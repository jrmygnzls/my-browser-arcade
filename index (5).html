<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0717">
<title>Nightfall: Endless Hunt – Abyssal Edition</title>
<style>
:root{--bg:#0b0717;--panel:rgba(20,15,37,.94);--line:rgba(190,161,255,.18);--text:#f6f0ff;--muted:#aa9cbe;--violet:#a77bff;--cyan:#65e5d1;--gold:#ffd36c;--red:#ff6b86}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#100b20}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,rgba(5,3,12,.55) 100%)}
#hud{position:absolute;left:0;right:0;top:0;padding:16px 18px 12px;display:grid;grid-template-columns:minmax(180px,1fr) auto minmax(180px,1fr);align-items:start;gap:14px;pointer-events:none;text-shadow:0 2px 12px #000}
.hud-panel{background:rgba(13,9,26,.7);border:1px solid var(--line);backdrop-filter:blur(10px);border-radius:14px;padding:10px 13px;min-width:0}
.brand{font-weight:900;letter-spacing:.14em;font-size:12px;color:#e9dfff}.brand span{color:var(--violet)}
.statline{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:12px;color:var(--muted)}.statline b{color:var(--text);font-size:14px}
.bar-wrap{height:8px;background:rgba(255,255,255,.1);border-radius:20px;overflow:hidden;margin-top:8px}.bar{height:100%;width:100%;border-radius:20px;transition:width .12s linear}.hp{background:linear-gradient(90deg,#ff5377,#ff9b9f)}.xp{background:linear-gradient(90deg,#7d61ff,#57d6e6)}
.center-hud{text-align:center}.time{font-size:24px;font-weight:900;letter-spacing:.06em}.wave{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.right-hud{text-align:right}.right-hud .statline{justify-content:flex-end}
#weaponbar{position:absolute;left:18px;bottom:18px;display:flex;gap:7px;max-width:min(82vw,920px);flex-wrap:wrap;pointer-events:none}
.weapon-chip{width:42px;height:42px;border-radius:12px;background:rgba(13,9,26,.76);border:1px solid var(--line);display:grid;place-items:center;position:relative;font-size:22px;box-shadow:0 6px 20px rgba(0,0,0,.25)}.weapon-chip small{position:absolute;right:4px;bottom:2px;font-size:10px;color:var(--gold);font-weight:900}
#bossbar{position:absolute;top:116px;left:50%;transform:translateX(-50%);width:min(440px,72vw);display:none;text-align:center;pointer-events:none}.bossname{font-size:10px;letter-spacing:.2em;color:#ffb2c0;font-weight:900;margin-bottom:5px}.boss-track{height:9px;background:#351728;border:1px solid #8f3e64;border-radius:20px;overflow:hidden}.boss-fill{height:100%;width:100%;background:linear-gradient(90deg,#ed386a,#ffab76)}
#hint{position:absolute;right:18px;bottom:20px;color:rgba(226,214,246,.62);font-size:11px;text-align:right;pointer-events:none;line-height:1.7}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(6,4,13,.48);backdrop-filter:blur(8px);z-index:5}
#overlay.hidden{display:none}.modal{width:min(760px,100%);max-height:min(92vh,900px);overflow:auto;background:linear-gradient(145deg,rgba(28,20,49,.98),rgba(12,9,25,.98));border:1px solid rgba(194,164,255,.25);border-radius:24px;padding:clamp(20px,4vw,36px);box-shadow:0 30px 100px rgba(0,0,0,.55);text-align:center}
.eyebrow{font-size:10px;letter-spacing:.28em;color:var(--cyan);font-weight:900;text-transform:uppercase}.title{margin:8px 0 4px;font-size:clamp(36px,7vw,66px);line-height:.98;letter-spacing:-.055em;font-weight:1000}.title .accent{color:var(--violet);text-shadow:0 0 34px rgba(167,123,255,.35)}.subtitle{color:var(--muted);max-width:550px;margin:12px auto 20px;line-height:1.6;font-size:14px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0 10px}.btn{border:1px solid rgba(200,175,255,.24);border-radius:12px;padding:12px 18px;background:rgba(255,255,255,.06);color:var(--text);font-weight:800;letter-spacing:.02em;cursor:pointer;transition:.16s transform,.16s background,.16s border-color;font-size:13px}.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.11);border-color:rgba(200,175,255,.55)}.btn.primary{background:linear-gradient(110deg,#8558ed,#b06bfa);border:0;box-shadow:0 8px 24px rgba(143,91,239,.28)}.btn.primary:hover{background:linear-gradient(110deg,#966cf8,#c17fff)}.btn.danger{border-color:rgba(255,107,134,.3);color:#ffb2c0}.small-note{color:var(--muted);font-size:11px;line-height:1.7;margin-top:14px}
.feature-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0}.feature{background:rgba(255,255,255,.035);border:1px solid rgba(190,161,255,.12);border-radius:13px;padding:13px 10px}.feature b{display:block;font-size:13px;margin-bottom:4px}.feature span{font-size:11px;color:var(--muted)}
.card-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 0}.upgrade-card{border:1px solid rgba(190,161,255,.22);border-radius:16px;background:linear-gradient(155deg,rgba(76,53,116,.38),rgba(255,255,255,.035));padding:18px 14px;text-align:left;min-height:170px;cursor:pointer;color:var(--text);transition:.18s transform,.18s border-color,.18s background}.upgrade-card:hover{transform:translateY(-5px);border-color:rgba(101,229,209,.72);background:linear-gradient(155deg,rgba(75,96,129,.4),rgba(255,255,255,.06))}.upgrade-icon{font-size:30px;margin-bottom:12px}.upgrade-name{font-size:15px;font-weight:900}.upgrade-rank{font-size:10px;color:var(--gold);margin-top:3px;letter-spacing:.08em;text-transform:uppercase}.upgrade-desc{font-size:11px;line-height:1.55;color:#b9accb;margin-top:9px}.tag{display:inline-block;border-radius:20px;padding:4px 8px;background:rgba(101,229,209,.1);color:var(--cyan);font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px auto;max-width:540px}.result-stat{background:rgba(255,255,255,.045);padding:14px;border-radius:13px}.result-stat strong{display:block;font-size:24px}.result-stat span{font-size:10px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
#toast{position:absolute;top:26%;left:50%;transform:translate(-50%,-10px);padding:9px 15px;border-radius:30px;background:rgba(18,12,34,.9);border:1px solid rgba(101,229,209,.4);font-size:12px;font-weight:800;opacity:0;transition:.2s;pointer-events:none;z-index:4}#toast.show{opacity:1;transform:translate(-50%,0)}
#mobile-controls{display:none;position:absolute;inset:0;pointer-events:none}.mobile-pad{pointer-events:auto;position:absolute;bottom:28px;left:25px;width:116px;height:116px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(15,10,28,.28)}#mobile-stick{position:absolute;width:42px;height:42px;border-radius:50%;left:36px;top:36px;background:rgba(188,157,255,.3);border:1px solid rgba(222,204,255,.5)}#dash-btn{pointer-events:auto;position:absolute;right:28px;bottom:38px;width:68px;height:68px;border-radius:50%;background:rgba(167,123,255,.22);border:1px solid rgba(220,197,255,.45);color:white;font-weight:900}
@media(max-width:700px){#hud{grid-template-columns:1fr auto;padding:9px;gap:7px}.center-hud{grid-column:2;grid-row:1}.right-hud{display:none}.hud-panel{padding:8px 10px}.brand{font-size:10px}.statline{font-size:10px;gap:8px;margin-top:5px}.statline b{font-size:12px}.time{font-size:18px}#weaponbar{left:9px;bottom:10px;max-width:78vw;gap:4px}.weapon-chip{width:34px;height:34px;font-size:16px}#hint{display:none}#bossbar{top:88px}.card-grid{grid-template-columns:1fr;gap:8px}.upgrade-card{min-height:0;padding:12px;display:grid;grid-template-columns:42px 1fr;column-gap:10px}.upgrade-icon{grid-row:1/4;margin:0}.upgrade-desc{margin-top:5px}.feature-row{grid-template-columns:1fr}.modal{padding:22px 16px}.subtitle{font-size:12px}.result-stats{gap:6px}.result-stat{padding:10px}.result-stat strong{font-size:20px}}
@media(pointer:coarse){#mobile-controls{display:block}}
</style>
</head>
<body>
<canvas id="game"></canvas><div class="vignette"></div>
<div id="hud" style="display:none">
  <div class="hud-panel">
    <div class="brand">NIGHTFALL <span> / ENDLESS HUNT</span></div>
    <div class="statline"><span>HP <b id="hptext">100/100</b></span><span>LV <b id="lvtext">1</b></span><span>KILLS <b id="killtext">0</b></span></div>
    <div class="bar-wrap"><div class="bar hp" id="hpbar"></div></div>
    <div class="bar-wrap" style="height:5px;margin-top:5px"><div class="bar xp" id="xpbar" style="width:0"></div></div>
  </div>
  <div class="hud-panel center-hud"><div class="time" id="time">00:00</div><div class="wave" id="wave">THE NIGHT IS YOUNG</div></div>
  <div class="hud-panel right-hud"><div class="brand">SURVIVAL STATUS</div><div class="statline"><span>ELAPSED <b id="elapsed">0:00</b></span><span>BEST <b id="best">0:00</b></span></div><div class="statline"><span>ENEMIES <b id="enemycount">0</b></span></div></div>
</div>
<div id="bossbar"><div class="bossname" id="bossname">THE NIGHTMARE</div><div class="boss-track"><div class="boss-fill" id="bossfill"></div></div></div>
<div id="weaponbar"></div><div id="hint">WASD / ARROWS · MOVE<br>SPACE · DASH · ESC · PAUSE</div>
<div id="toast"></div>
<div id="mobile-controls"><div class="mobile-pad" id="mobile-pad"><div id="mobile-stick"></div></div><button id="dash-btn">DASH</button></div>
<div id="overlay"><div class="modal" id="modal"></div></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=innerWidth,H=innerHeight,DPR=1;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),fmt=t=>{let s=Math.floor(t),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const safeStore={get(k,d){try{return localStorage.getItem(k)??d}catch{return d}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let mode='menu',last=0,game=null,keys={},touchVec={x:0,y:0},touchActive=false,toastTimer=0;
const WEAPONS={
  wand:{name:'Arcane Wand',icon:'✦',desc:'Rapid homing bolts that pierce targets and split into extra shots.',max:8,type:'weapon'},
  fire:{name:'Ember Shot',icon:'☄️',desc:'Heavy firebolts detonate in layered blasts and leave burning ground.',max:8,type:'weapon'},
  orbit:{name:'Void Blades',icon:'✧',desc:'A growing ring of razor shards sweeps around you and tears through packs.',max:8,type:'weapon'},
  storm:{name:'Storm Call',icon:'ϟ',desc:'Chain lightning jumps between enemies before bursting in a thunderclap.',max:8,type:'weapon'},
  frost:{name:'Glacial Pulse',icon:'❄️',desc:'Freezing sigils erupt in wide rings, slowing and shattering enemies.',max:8,type:'weapon'},
  nova:{name:'Solar Nova',icon:'☼',desc:'Radiant pulses expand in stacked waves and scorch everything nearby.',max:8,type:'weapon'},
  blood:{name:'Sanguine Needles',icon:'🩸',desc:'A fan of piercing blood darts inflicts bleeding and restores a little health.',max:8,type:'weapon'},
  poison:{name:'Plague Bloom',icon:'☣️',desc:'Lobbed plague seeds blossom into toxic pools that damage and weaken hordes.',max:8,type:'weapon'},
  meteor:{name:'Meteor Covenant',icon:'☄',desc:'Marks enemies for delayed meteor impacts with huge area damage.',max:8,type:'weapon'},
  reaper:{name:"Reaper's Arc",icon:'⚔️',desc:'A sweeping spectral scythe cleaves a wide cone and executes wounded foes.',max:8,type:'weapon'},
  rune:{name:'Aether Turrets',icon:'🔮',desc:'Floating runic sentries orbit you and fire focused bolts at nearby threats.',max:8,type:'weapon'}
};
const PASSIVES={
  might:{name:'Brutal Might',icon:'⚔️',desc:'+15% damage for all weapons.',max:5},
  haste:{name:'Quick Hands',icon:'⌛',desc:'Attack cooldowns recover 10% faster.',max:5},
  area:{name:'Expanding Force',icon:'◎',desc:'+12% weapon area and projectile size.',max:5},
  vigor:{name:'Vitality',icon:'♥',desc:'+25 maximum HP and restore 25 HP.',max:5},
  armor:{name:'Iron Skin',icon:'🛡️',desc:'Reduce incoming damage by 1.',max:5},
  swift:{name:'Fleet Foot',icon:'👟',desc:'+8% movement speed.',max:5},
  magnet:{name:'Soul Magnet',icon:'🧲',desc:'Collect XP gems from farther away.',max:5},
  greed:{name:'Scholar of Souls',icon:'✧',desc:'+15% XP gained.',max:5},
  regen:{name:'Blood Renewal',icon:'✚',desc:'Regenerate 0.3 HP per second.',max:5},
  luck:{name:'Fortune',icon:'☘️',desc:'Better chance for treasure and bonus drops.',max:5},
  leech:{name:'Crimson Communion',icon:'🩸',desc:'Leech a portion of direct weapon damage as health.',max:5},
  hex:{name:'Withering Hex',icon:'♜',desc:'Status effects last longer and deal more damage.',max:5},
  echo:{name:'Echo Chamber',icon:'◈',desc:'Chance for spells to repeat at reduced power.',max:5},
  aegis:{name:'Abyssal Aegis',icon:'⛨',desc:'Build a rechargeable ward that absorbs part of a hit.',max:5}
};
const TYPE_DATA={
  shambler:{name:'Hollow',hp:34,speed:43,r:13,dmg:10,xp:1,color:'#8f75c9'},
  bat:{name:'Night Bat',hp:18,speed:98,r:10,dmg:8,xp:1,color:'#e17caf'},
  wraith:{name:'Wraith',hp:58,speed:67,r:14,dmg:13,xp:2,color:'#62b9b7'},
  shade:{name:'Gloom Stalker',hp:135,speed:82,r:14,dmg:20,xp:5,color:'#9b75da'},
  cultist:{name:'Hex Adept',hp:52,speed:34,r:14,dmg:10,xp:3,color:'#d3a85b'},
  brute:{name:'Grave Brute',hp:145,speed:25,r:20,dmg:20,xp:4,color:'#cc705c'},
  hellhound:{name:'Ash Hound',hp:76,speed:91,r:15,dmg:15,xp:3,color:'#d66a48'},
  boneguard:{name:'Bone Guard',hp:190,speed:31,r:18,dmg:18,xp:5,color:'#b9b2a0'},
  spitter:{name:'Rot Spitter',hp:82,speed:26,r:16,dmg:14,xp:4,color:'#8bbd62'},
  abomination:{name:'Stitched Abomination',hp:360,speed:20,r:26,dmg:28,xp:9,color:'#8d5d82'},
  elite:{name:'Dread Knight',hp:340,speed:32,r:23,dmg:27,xp:14,color:'#ec567d'}
};
const UPGRADES=Object.entries(WEAPONS).map(([id,w])=>({id,...w})).concat(Object.entries(PASSIVES).map(([id,p])=>({id,...p,type:'passive'})));
function newGame(){
  let best=Number(safeStore.get('nightfall-best','0'))||0;
  game={time:0,spawn:0,bossTimer:102,kills:0,level:1,xp:0,xpNeed:8,choiceQueue:0,player:{x:0,y:0,r:14,hp:135,maxHp:135,speed:242,damage:1.08,cooldown:.84,area:1.1,projectileSpeed:1.16,duration:1.1,magnet:140,xpGain:1,armor:0,regen:0,luck:0,lifesteal:0,statusPower:1,echo:0,ward:0,wardTimer:0,invuln:0,dashCd:0,dashTime:0,angle:0,orbitHit:{},orbitAngle:0},weapons:{wand:1,fire:0,orbit:0,storm:0,frost:0,nova:0,blood:0,poison:0,meteor:0,reaper:0,rune:0},passives:{},weaponTimers:{},enemies:[],bullets:[],enemyBullets:[],gems:[],particles:[],effects:[],floats:[],chests:[],lightning:[],poisonZones:[],meteors:[],nextId:1,best,shake:0,damageFlash:0,toast:'',boss:null,runSeed:Math.floor(Math.random()*999999)};
  game.weaponTimers.wand=0.12;game.weaponTimers.blood=.6;game.weaponTimers.rune=.4;
}
function showOverlay(html){$('modal').innerHTML=html;$('overlay').classList.remove('hidden')}
function hideOverlay(){$('overlay').classList.add('hidden')}
function menu(){mode='menu';game=null;$('hud').style.display='none';$('weaponbar').innerHTML='';$('bossbar').style.display='none';showOverlay(`
  <div class="eyebrow">A roguelite survival experience</div><h1 class="title">NIGHT<span class="accent">FALL</span></h1><div class="eyebrow" style="color:#cbb7ff;letter-spacing:.42em">ENDLESS HUNT</div>
  <p class="subtitle">The night keeps coming. Battle swarming monsters, survive frequent multi-phase bosses, collect lost souls, and forge an arsenal of eleven evolving weapons and forbidden powers.</p>
  <div class="actions"><button class="btn primary" id="start">START RUN&nbsp; ↗</button><button class="btn" id="how">HOW TO PLAY</button></div>
  <div class="feature-row"><div class="feature"><b>⚔️ Auto combat</b><span>Your weapons attack for you</span></div><div class="feature"><b>✦ Random builds</b><span>Choose upgrades every level</span></div><div class="feature"><b>☠ Endless waves</b><span>Dense monster packs, frequent bosses, and escalating danger</span></div></div>
  <div class="small-note">BEST SURVIVAL: <b style="color:#ffd36c">${fmt(game?.best||Number(safeStore.get('nightfall-best','0'))||0)}</b><br>WASD / Arrow keys to move · Space to dash · Esc to pause · Works completely offline</div>`);
  $('start').onclick=startGame;$('how').onclick=()=>helpScreen('menu');
}
function helpScreen(back){showOverlay(`<div class="eyebrow">Field manual</div><h2 class="title" style="font-size:38px">HOW TO <span class="accent">SURVIVE</span></h2><p class="subtitle">You are outnumbered. Keep moving and let your weapons do the work.</p><div style="text-align:left;max-width:540px;margin:0 auto;color:#cfc3dc;font-size:13px;line-height:1.9"><b style="color:white">Movement</b> — WASD or arrow keys. On touchscreens, use the virtual joystick.<br><b style="color:white">Dash</b> — Space or the DASH button. Briefly boosts speed and grants invulnerability.<br><b style="color:white">Level up</b> — Collect the glowing soul gems dropped by enemies. Choose 1 of 3 random upgrades.<br><b style="color:white">Build your character</b> — Unlock eleven weapons, stack passive buffs, and combine damage-over-time, area-control, summon, and execute effects. Duplicate weapon upgrades increase their power.<br><b style="color:white">Treasure</b> — Defeat elite enemies and bosses to find chests with bonus rewards.<br><b style="color:white">Rising danger</b> — Hordes arrive in larger packs, enemy health and damage climb every minute, new monster types join the hunt, and multi-phase bosses return more often. <br><b style="color:white">Endless mode</b> — There is no final level. Enemy strength continues scaling for as long as you survive.</div><div class="actions"><button class="btn primary" id="back">GOT IT</button></div>`);$('back').onclick=()=>back==='menu'?menu():pauseGame()}
function startGame(){newGame();mode='playing';hideOverlay();$('hud').style.display='grid';$('bossbar').style.display='none';$('weaponbar').innerHTML='';last=performance.now();updateHud();}
function pauseGame(){if(mode==='playing'){mode='paused';showOverlay(`<div class="eyebrow">Catch your breath</div><h2 class="title" style="font-size:48px">PAUSED</h2><p class="subtitle">The night is waiting. Your run is safe.</p><div class="actions"><button class="btn primary" id="resume">RESUME</button><button class="btn" id="manual">HOW TO PLAY</button><button class="btn danger" id="quit">END RUN</button></div><div class="small-note">SURVIVED ${fmt(game.time)} · LEVEL ${game.level} · ${game.kills} KILLS</div>`);$('resume').onclick=()=>{mode='playing';hideOverlay();last=performance.now()};$('manual').onclick=()=>helpScreen('pause');$('quit').onclick=()=>menu()}else if(mode==='paused'){mode='playing';hideOverlay();last=performance.now()}}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1700)}
function choices(){let avail=UPGRADES.filter(u=>u.type==='weapon'?game.weapons[u.id]<u.max:(game.passives[u.id]||0)<u.max);let picks=[],offer=game.level%4===0?4:3;while(avail.length&&picks.length<offer){let ix=Math.floor(Math.random()*avail.length);picks.push(avail.splice(ix,1)[0])}return picks}
function levelUp(){if(mode!=='playing'&&mode!=='levelup')return;mode='levelup';game.choiceQueue++;const picks=choices();if(!picks.length){game.player.maxHp+=10;game.player.hp=Math.min(game.player.maxHp,game.player.hp+10);mode='playing';hideOverlay();return}

  ctx.shadowBlur=10;ctx.shadowColor=e.type==='spitter'?'#baff75':'#ff526e';ctx.fillStyle=e.type==='spitter'?'#d9ff9d':'#ffefc5';ctx.beginPath();ctx.ellipse(e.r*.22,-e.r*.48,Math.max(1.8,e.r*.11),Math.max(1.6,e.r*.075),0,0,Math.PI*2);ctx.ellipse(e.r*.51,-e.r*.48,Math.max(1.8,e.r*.11),Math.max(1.6,e.r*.075),0,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  if(e.slow>0||e.burnTimer>0||e.bleedTimer>0){ctx.strokeStyle=e.slow>0?'#80eaff':e.burnTimer>0?'#ffad55':'#f06b8b';ctx.globalAlpha=.7;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,e.r+4+Math.sin(t*8)*1.5,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}

}
function drawPlayerModel(p,x,y){
  ctx.save();ctx.translate(x,y);const t=game.time;ctx.shadowBlur=p.invuln>0?34:22;ctx.shadowColor=p.invuln>0?'#fff':'#a77bff';
  // Flowing mantle and layered robe.
  ctx.fillStyle='#302044';ctx.beginPath();ctx.moveTo(-p.r*.68,-p.r*.25);ctx.quadraticCurveTo(-p.r*1.55,p.r*.55,-p.r*.82,p.r*1.45);ctx.lineTo(p.r*.82,p.r*1.45);ctx.quadraticCurveTo(p.r*1.4,p.r*.35,p.r*.68,-p.r*.25);ctx.closePath();ctx.fill();
  const robe=ctx.createLinearGradient(-p.r,0,p.r,p.r);robe.addColorStop(0,'#554078');robe.addColorStop(.5,'#c9b6ff');robe.addColorStop(1,'#624890');ctx.fillStyle=robe;ctx.beginPath();ctx.moveTo(-p.r*.7,-p.r*.2);ctx.lineTo(0,-p.r*.82);ctx.lineTo(p.r*.7,-p.r*.2);ctx.lineTo(p.r*.48,p.r*1.05);ctx.lineTo(-p.r*.48,p.r*1.05);ctx.closePath();ctx.fill();
  ctx.fillStyle='#21172e';ctx.beginPath();ctx.arc(0,-p.r*.56,p.r*.49,0,Math.PI*2);ctx.fill();ctx.fillStyle='#d7c7ff';ctx.beginPath();ctx.arc(0,-p.r*.58,p.r*.33,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#34224f';ctx.beginPath();ctx.moveTo(-p.r*.42,-p.r*.72);ctx.lineTo(0,-p.r*1.42);ctx.lineTo(p.r*.42,-p.r*.72);ctx.closePath();ctx.fill();
  ctx.fillStyle='#f4eaff';ctx.beginPath();ctx.arc(-p.r*.12,-p.r*.55,1.8,0,Math.PI*2);ctx.arc(p.r*.12,-p.r*.55,1.8,0,Math.PI*2);ctx.fill();
  ctx.rotate(p.angle);ctx.strokeStyle='#c9b6ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(p.r*.45,0);ctx.lineTo(p.r*1.35,-p.r*.5);ctx.stroke();ctx.fillStyle='#9feaff';ctx.shadowColor='#8de8ff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(p.r*1.4,-p.r*.53,3.6,0,Math.PI*2);ctx.fill();ctx.restore();
}

function draw(){ctx.clearRect(0,0,W,H);let p=game?.player||{x:0,y:0};let sx=game?rand(-game.shake,game.shake):0,sy=game?rand(-game.shake,game.shake):0;ctx.save();ctx.translate(sx,sy);
  let grad=ctx.createRadialGradient(W/2,H/2,40,W/2,H/2,Math.max(W,H)*.75);grad.addColorStop(0,'#1b1530');grad.addColorStop(1,'#080611');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
  // Infinite floor grid and ambient motes
  const grid=72,ox=game?(-(p.x%grid)+W/2)%grid:0,oy=game?(-(p.y%grid)+H/2)%grid:0;ctx.strokeStyle='rgba(166,137,220,.075)';ctx.lineWidth=1;ctx.beginPath();for(let x=ox;x<W;x+=grid){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=oy;y<H;y+=grid){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
  for(let i=0;i<48;i++){let x=((i*193+Math.floor((game?.time||0)*4)*17)%W),y=((i*317+Math.floor((game?.time||0)*7)*11)%H);ctx.fillStyle=`rgba(191,166,255,${.1+((i*7)%9)/50})`;ctx.fillRect(x,y,2,2)}
  if(game){
    for(let z of game.poisonZones){let q=screenPoint(z.x,z.y),pulse=.94+.06*Math.sin(game.time*5+z.x);ctx.save();ctx.translate(q.x,q.y);let mist=ctx.createRadialGradient(0,0,5,0,0,z.r*pulse);mist.addColorStop(0,'rgba(131,221,75,.34)');mist.addColorStop(.7,'rgba(76,166,63,.22)');mist.addColorStop(1,'rgba(76,166,63,0)');ctx.fillStyle=mist;ctx.beginPath();ctx.arc(0,0,z.r*pulse,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(170,255,123,.55)';ctx.lineWidth=2;ctx.setLineDash([7,9]);ctx.beginPath();ctx.arc(0,0,z.r*.84,-game.time,Math.PI*2-game.time);ctx.stroke();ctx.setLineDash([]);for(let k=0;k<7;k++){let a=k*2.4+game.time*.7,r=z.r*(.2+.55*((k*7)%10)/10);ctx.fillStyle='rgba(175,255,125,.35)';ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r,2+(k%3),0,Math.PI*2);ctx.fill()}ctx.restore()}
    for(let m of game.meteors){let q=screenPoint(m.x,m.y),t=1-m.life/m.max;ctx.save();ctx.translate(q.x,q.y);ctx.globalAlpha=.7;ctx.strokeStyle='#ffad62';ctx.lineWidth=3;ctx.setLineDash([8,7]);ctx.beginPath();ctx.arc(0,0,m.r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;let y=-210*t;ctx.shadowBlur=32;ctx.shadowColor=m.color;let rock=ctx.createRadialGradient(-7,y-8,2,0,y,23);rock.addColorStop(0,'#fff1b2');rock.addColorStop(.4,m.color);rock.addColorStop(1,'#9d2e31');ctx.fillStyle=rock;ctx.beginPath();ctx.arc(0,y,20+4*Math.sin(t*10),0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffcb83';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-4,y+15);ctx.lineTo(-15,y+55);ctx.stroke();ctx.restore()}
    for(let g of game.gems){let q=screenPoint(g.x,g.y);ctx.save();ctx.translate(q.x,q.y);ctx.rotate(Math.PI/4);ctx.shadowBlur=13;ctx.shadowColor='#61dfff';ctx.fillStyle='#75e8ff';ctx.fillRect(-g.r/1.5,-g.r/1.5,g.r*1.35,g.r*1.35);ctx.restore()}
    for(let c of game.chests){let q=screenPoint(c.x,c.y);ctx.save();ctx.translate(q.x,q.y);ctx.shadowBlur=20;ctx.shadowColor='#ffd36c';ctx.fillStyle='#a968e8';ctx.fillRect(-11,-7,22,16);ctx.fillStyle='#ffd36c';ctx.fillRect(-11,-2,22,4);ctx.fillRect(-2,-8,4,18);ctx.restore()}
    for(let b of game.bullets){let q=screenPoint(b.x,b.y),tail=screenPoint(b.x-b.vx*.12,b.y-b.vy*.12);ctx.save();ctx.lineCap='round';ctx.strokeStyle=b.color;ctx.globalAlpha=.82;ctx.lineWidth=Math.max(2,b.r*(b.kind==='fire'?1.8:1.2));ctx.shadowBlur=b.kind==='fire'?30:22;ctx.shadowColor=b.color;ctx.beginPath();ctx.moveTo(tail.x,tail.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.globalAlpha=1;if(b.kind==='blood'){ctx.translate(q.x,q.y);ctx.rotate(Math.atan2(b.vy,b.vx));ctx.fillStyle='#ffb0c4';ctx.beginPath();ctx.moveTo(b.r*1.6,0);ctx.lineTo(-b.r, -b.r*.55);ctx.lineTo(-b.r*.45,0);ctx.lineTo(-b.r,b.r*.55);ctx.closePath();ctx.fill()}else{ctx.fillStyle='#fff7ff';ctx.beginPath();ctx.arc(q.x,q.y,Math.max(2,b.r*.58),0,Math.PI*2);ctx.fill()}ctx.restore()}
    for(let b of game.enemyBullets){let q=screenPoint(b.x,b.y);ctx.beginPath();ctx.save();ctx.shadowBlur=16;ctx.shadowColor=b.color||'#ff6688';ctx.fillStyle=b.color||'#ff7192';ctx.beginPath();ctx.arc(q.x,q.y,b.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(q.x-b.r*.25,q.y-b.r*.25,Math.max(1,b.r*.28),0,Math.PI*2);ctx.fill();ctx.restore()}
    for(let e of game.enemies){let q=screenPoint(e.x,e.y);drawEnemyModel(e,q)}
    // Spell shockwaves, frost halos, and solar detonations.
    for(let fx of game.effects){let q=screenPoint(fx.x,fx.y),t=1-fx.life/fx.max;ctx.save();ctx.translate(q.x,q.y);ctx.globalAlpha=Math.max(0,1-t);ctx.strokeStyle=fx.color;ctx.fillStyle=fx.color;ctx.shadowBlur=24;ctx.shadowColor=fx.color;ctx.lineCap='round';if(fx.type==='slash'){ctx.rotate(fx.angle);ctx.lineWidth=fx.width*(1-t)+1;ctx.beginPath();ctx.arc(0,0,fx.maxR*(.72+.28*t),-.95+t*.1,.95-t*.1);ctx.stroke();ctx.globalAlpha*=.7;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,fx.maxR*(.72+.28*t),-.78+t*.1,.78-t*.1);ctx.stroke()}else if(fx.type==='nova'){let r=fx.maxR*(.18+.82*t);ctx.lineWidth=fx.width*(1-t)+1;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();ctx.globalAlpha*=.65;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,0,r*.72,0,Math.PI*2);ctx.stroke();for(let k=0;k<16;k++){let a=fx.rotation+k*Math.PI/8;let r1=r*.82,r2=r*(1.02+.08*Math.sin(t*8+k));ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);ctx.stroke()}}else{let r=fx.maxR*t;ctx.lineWidth=fx.width*(1-t)+1;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.stroke();if(fx.type==='frost'){for(let k=0;k<12;k++){let a=fx.rotation+k*Math.PI/6;ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.82,Math.sin(a)*r*.82);ctx.lineTo(Math.cos(a)*r*1.04,Math.sin(a)*r*1.04);ctx.stroke()}}}ctx.restore()}
    // Orbiting blades
    let rank=game.weapons.orbit;if(rank>0){let cnt=Math.min(6,1+Math.floor((rank+1)/2)),rad=(48+rank*7)*p.area;for(let i=0;i<cnt;i++){let a=p.orbitAngle+i*Math.PI*2/cnt,x=W/2+Math.cos(a)*rad,y=H/2+Math.sin(a)*rad;ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.shadowBlur=26;ctx.shadowColor='#b2a0ff';ctx.fillStyle='#f1eaff';ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(7,0);ctx.lineTo(0,16);ctx.lineTo(-7,0);ctx.closePath();ctx.fill();ctx.strokeStyle='#a992ff';ctx.lineWidth=2;ctx.stroke();ctx.restore()}}
    let runeRank=game.weapons.rune||0;if(runeRank>0){let n=Math.min(5,1+Math.floor(runeRank/2)),rr=74+runeRank*8;for(let i=0;i<n;i++){let a=-game.time*1.3+i*Math.PI*2/n,x=W/2+Math.cos(a)*rr,y=H/2+Math.sin(a)*rr;ctx.save();ctx.translate(x,y);ctx.rotate(-a+game.time*.5);ctx.shadowBlur=24;ctx.shadowColor='#8de3ff';ctx.strokeStyle='#c8f5ff';ctx.fillStyle='rgba(87,181,255,.32)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(7,0);ctx.lineTo(0,8);ctx.lineTo(-7,0);ctx.closePath();ctx.stroke();ctx.restore()}}
    for(let l of game.lightning){ctx.save();ctx.globalAlpha=clamp(l.life/(l.max||.3),0,1);ctx.strokeStyle=l.color;ctx.lineWidth=4;ctx.lineJoin='round';ctx.lineCap='round';ctx.shadowBlur=24;ctx.shadowColor=l.color;ctx.beginPath();l.points.forEach((pt,i)=>{let q=screenPoint(pt.x,pt.y);if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});ctx.stroke();ctx.lineWidth=1.5;ctx.strokeStyle='#f2ffff';ctx.beginPath();l.points.forEach((pt,i)=>{let q=screenPoint(pt.x,pt.y);if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});ctx.stroke();ctx.restore()}
    // Nova/frost radius hint not shown; player glow
    let glow=ctx.createRadialGradient(W/2,H/2,3,W/2,H/2,62);glow.addColorStop(0,'rgba(225,209,255,.42)');glow.addColorStop(.45,'rgba(145,110,255,.14)');glow.addColorStop(1,'rgba(163,111,255,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(W/2,H/2,62,0,Math.PI*2);ctx.fill();
    for(let part of game.particles){let q=screenPoint(part.x,part.y);ctx.globalAlpha=clamp(part.life/part.max,0,1);ctx.fillStyle=part.color;ctx.beginPath();ctx.arc(q.x,q.y,part.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
    for(let f of game.floats){let q=screenPoint(f.x,f.y);ctx.globalAlpha=clamp(f.life/.8,0,1);ctx.fillStyle=f.color;ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(f.text,q.x,q.y);ctx.globalAlpha=1}
    // Player character
    drawPlayerModel(p,W/2,H/2);
    // Soft enemy pressure vignette
    if(p.hp/p.maxHp<.35){ctx.fillStyle=`rgba(255,40,88,${.07+.06*Math.sin(game.time*8)})`;ctx.fillRect(0,0,W,H)}
  }else{
    // title screen ambient stars
    for(let i=0;i<70;i++){let x=(i*173)%W,y=(i*293)%H;ctx.fillStyle=`rgba(198,174,255,${.1+(i%5)*.05})`;ctx.beginPath();ctx.arc(x,y,(i%3)+.5,0,Math.PI*2);ctx.fill()}
    ctx.strokeStyle='rgba(160,130,220,.13)';ctx.beginPath();ctx.arc(W/2,H/2,Math.min(W,H)*.25,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
  if(game&&game.damageFlash>0){ctx.fillStyle=`rgba(255,40,70,${game.damageFlash*.45})`;ctx.fillRect(0,0,W,H)}
  requestAnimationFrame(draw);
}
function loop(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;if(mode==='playing')update(dt);requestAnimationFrame(loop)}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Escape'){if(mode==='playing')pauseGame();else if(mode==='paused')pauseGame()} });addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{keys={};if(mode==='playing')pauseGame()});
// Touchscreen joystick
const pad=$('mobile-pad'),stick=$('mobile-stick');let padRect=null;pad.addEventListener('pointerdown',e=>{touchActive=true;padRect=pad.getBoundingClientRect();pad.setPointerCapture(e.pointerId);moveTouch(e)});pad.addEventListener('pointermove',e=>{if(touchActive)moveTouch(e)});function moveTouch(e){let r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=39;if(len>max){dx=dx/len*max;dy=dy/len*max}touchVec={x:dx/max,y:dy/max};stick.style.left=(36+dx)+'px';stick.style.top=(36+dy)+'px'}function endTouch(){touchActive=false;touchVec={x:0,y:0};stick.style.left='36px';stick.style.top='36px'}pad.addEventListener('pointerup',endTouch);pad.addEventListener('pointercancel',endTouch);$('dash-btn').addEventListener('pointerdown',e=>{e.preventDefault();keys.Space=true;setTimeout(()=>keys.Space=false,50)});
// Game starts in menu; the animation loop is always active.
menu();requestAnimationFrame(draw);last=performance.now();requestAnimationFrame(loop);
})();
